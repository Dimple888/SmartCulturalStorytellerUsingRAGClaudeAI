spring.application.name=spring-ai-smart-cultural-storyteller
server.port=8080

# Anthropic Claude Configuration
# IMPORTANT: Set ANTHROPIC_API_KEY environment variable before running the app
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:demo}
spring.ai.anthropic.chat.options.model=claude-3-haiku-20240307
spring.ai.anthropic.chat.options.temperature=0.7
spring.ai.anthropic.chat.options.max-tokens=2048

# Demo mode: Set to true to use fallback responses instead of calling Claude API
app.demo-mode=true

# Database Configuration
spring.datasource.url=jdbc:h2:mem:sundarakanda_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Cultural Texts Path
cultural.texts.path=classpath:cultural-texts/sundarakanda.txt
story.narration.default.title=Sundarakanda Story
anime.prompt.default.style=Fantasy

# Logging
logging.level.root=INFO
logging.level.com.example.animenarrrator=DEBUG

# Jackson Configuration
spring.jackson.serialization.indent-output=true

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
server.servlet.context-path=/
spring.mvc.static-path-pattern=/**
# Multimedia Generation Configuration
app.multimedia.output-dir=./anime-videos
app.multimedia.ffmpeg-path=C:\\ffmpeg\\bin\\ffmpeg.exe
app.multimedia.enable-video-generation=true
app.multimedia.video-codec=libx264
app.multimedia.audio-codec=aac
app.multimedia.audio-bitrate=192k